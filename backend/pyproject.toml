[project]
name = "quinta-api"
version = "0.1.0"
description = "Quinta — marketplace de palapas, quintas y salones para eventos (API)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "email-validator==2.2.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "geoalchemy2==0.16.0",
  "greenlet==3.1.1",
  "redis==5.2.1",
  "celery[redis]==5.4.0",
  "stripe==11.4.1",
  "httpx==0.28.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.2.1",
  "pyotp==2.9.0",
  "python-multipart==0.0.20",
  "slowapi==0.1.9",
  "boto3==1.35.90",
  "reportlab==4.2.5",
  "weasyprint==63.1 ; sys_platform != 'win32'",
  "orjson==3.10.13",
  "structlog==24.4.0",
  "zoneinfo2icu==0.1.0",
  "tenacity==9.0.0",
  "pybreaker==1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "anyio==4.7.0",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "factory-boy==3.3.1",
  "faker==33.1.0",
  "testcontainers[postgres]==4.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --maxfail=1"
markers = [
  "integration: requiere Postgres/Redis (testcontainers o docker compose)",
  "concurrency: pruebas de solape y carreras",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
